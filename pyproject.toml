[project]
name = "RAG_against_the_machine"
version = "0.1.0"
description = "Retrieval Augmented Generation"
requires-python = "==3.10.*"
dependencies = [
    "pydantic>=2.0.0",
    "fire==0.7.1",
    "tqdm==4.68.3",
    "sentence-transformers>=5.6.1",
    "chromadb==1.5.9",
    "ollama>=0.6.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "types-tqdm"
]

[[tool.mypy.overrides]]
module = "fire.*"
ignore_missing_imports = true
